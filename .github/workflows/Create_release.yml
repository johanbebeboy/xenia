name: Create release

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
    secrets:
      RELEASE_TOKEN:
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true # Flattens all files into the root directory instead of nested folders
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository_owner }}/xenia-canary-releases
          notes: ${{ github.event.head_commit.message }}
        run: |
          case ${{ inputs.os }} in
            windows)
              asset=xenia_canary_${{ inputs.os }}.zip
              # Finds files in the root folder and compresses them
              7z a $asset * -xr!'*.pdb' -mx9 -bb3
              ;;
            linux)
              asset=xenia_canary_${{ inputs.os }}.tar.xz
              # FIXED: Added the missing compression command for linux
              tar -cJf $asset *
              ;;
          esac
          if [ ! -f $asset ]; then
            ls -R
            echo "::error::$asset doesn't exist!"
            exit 1
          fi
          if [ $(stat -c%s $asset) -lt 100000 ]; then
            ls -R
            echo "::error::$asset is too small!"
            exit 1
          fi
          create_or_edit_release() {
            local tag=$1
            local title=$2
            # Safe checking to prevent silent Bash crashes
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" -t "$title" -n "$notes"
              gh release upload "$tag" "$asset" --clobber
            else
              gh release create "$tag" "$asset" --target GibbedAvatars -t "$title" -n "$notes"
            fi
          }
          tag=${GITHUB_SHA::7}
          create_or_edit_release "$tag" "${tag}_$GITHUB_REF_NAME"
          create_or_edit_release "$GITHUB_REF_NAME" "$tag"
